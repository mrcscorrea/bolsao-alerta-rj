<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Bolsão Alerta RJ — monitoramento em tempo real de bolsões d'água nas vias críticas do Rio de Janeiro." />
    <meta name="theme-color" content="#0E0F0C" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // aplica o tema salvo antes do primeiro paint (evita "flash" de tema errado)
      try {
        var t = localStorage.getItem('tema');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>Bolsão Alerta RJ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
